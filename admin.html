<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Armain</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <h1>ARMAIN</h1>
      <nav>
        <button data-tab="slides">Slides</button>
        <button data-tab="categorias">Categorías</button>
        <button data-tab="productos">Productos</button>
        <button data-tab="admins">Administradores</button>
      </nav>
      <button id="logout" class="logout">Salir</button>
    </aside>
    <main class="content">
      <div id="login-box">
        <h2>Acceso administrativo</h2>
        <input id="email" placeholder="Email"/>
        <input id="password" type="password" placeholder="Contraseña"/>
        <button id="login">Ingresar</button>
        <p class="hint">Usa Firebase Authentication.</p>
      </div>
      <div id="panel" style="display:none">
        <section id="tab-slides" class="tab">
          <h2>Slides del header</h2>
          <input type="file" id="slide-file" accept="image/*"/>
          <button id="upload-slide">Subir a Cloudinary</button>
          <div id="slides-list" class="list"></div>
        </section>
        <section id="tab-categorias" class="tab" style="display:none">
          <h2>Categorías</h2>
          <input id="cat-nombre" placeholder="Nombre"/>
          <input id="cat-desc" placeholder="Descripción corta"/>
          <button id="add-cat">Agregar</button>
          <div id="cats-list" class="list"></div>
        </section>
        <section id="tab-productos" class="tab" style="display:none">
          <h2>Productos</h2>
          <div class="form-grid">
            <input id="prod-nombre" placeholder="Nombre"/>
            <input id="prod-marca" placeholder="Marca"/>
            <input id="prod-precio" type="number" placeholder="Precio ARS"/>
            <select id="prod-cat"></select>
            <input id="prod-imagen-file" type="file" accept="image/*"/>
            <textarea id="prod-desc" placeholder="Descripción premium (SEO)"></textarea>
            <input id="prod-notas" placeholder="Notas separadas por coma"/>
          </div>
          <button id="add-prod">Guardar producto</button>
          <div id="prods-list" class="list"></div>
        </section>
        <section id="tab-admins" class="tab" style="display:none">
          <h2>Administradores</h2>
          <input id="new-admin-email" placeholder="Email nuevo admin"/>
          <input id="new-admin-pass" type="password" placeholder="Contraseña temporal"/>
          <button id="add-admin">Crear administrador</button>
        </section>
      </div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
