<!DOCTYPE html><html lang="es-AR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin — Armain</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400&display=swap" rel="stylesheet"><style>:root{--navy:#0A192F;--beige:#F4EDE4;--gold:#C9A886}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1000px 600px at 50% 0%, #112240, var(--navy));font-family:Inter,sans-serif;color:#0A192F}.card{background:var(--beige);padding:3rem 2.5rem;width:min(420px,92%);box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center}h1{font-family:'Cormorant Garamond',serif;font-weight:500;margin:.8rem 0 .3rem;font-size:2rem;color:var(--navy)}p{opacity:.7;margin-bottom:1.8rem}input{width:100%;padding:.95rem 1rem;margin:.4rem 0;border:1px solid #e2d7c9;background:white;font-size:.95rem}button{width:100%;padding:1rem;margin-top:.8rem;background:var(--navy);color:var(--beige);border:0;cursor:pointer;letter-spacing:.02em;transition:.2s}button:hover{background:#112240}img{height:42px;margin:0 auto .5rem}a{color:var(--navy);opacity:.7;font-size:.85rem;text-decoration:none}a:hover{opacity:1}</style></head><body><div class="card"><img src="assets/logo.png" alt="Armain"><h1>Área Administrativa</h1><p>Acceso con Firebase Auth</p><form onsubmit="event.preventDefault();alert('Conecta tu Firebase aquí')"><input type="email" placeholder="Email" required><input type="password" placeholder="Contraseña" required><button>Ingresar</button></form><p style="margin-top:1.5rem"><a href="index.html">← Volver al sitio</a></p></div></body></html>
