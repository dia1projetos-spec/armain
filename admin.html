<!DOCTYPE html>
<html lang="es-AR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración - Armain</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css"></head>
<body>
<div id="login-screen" class="login-wrapper">
 <div class="login-card">
  <div class="crown">♛</div><h1>Administración Privée</h1>
  <form id="login-form">
   <div class="input-wrap"><span>✉</span><input id="email" type="email" placeholder="Correo electrónico" required></div>
   <div class="input-wrap"><span>🔒</span><input id="password" type="password" placeholder="Contraseña" required><button type="button" id="toggle">👁</button></div>
   <div class="opts"><label><input type="checkbox"> Recordarme</label><a href="#">¿Olvidaste tu contraseña?</a></div>
   <button class="btn-gold" type="submit">ENTRAR</button>
  </form><p class="foot">PANEL ADMINISTRATIVO EXCLUSIVO</p>
 </div>
</div>
<div id="admin-panel" class="admin" style="display:none">
 <aside class="sidebar"><div class="brand">Armain</div>
  <nav><button data-tab="slides" class="active">Slides</button><button data-tab="categorias">Categorías</button><button data-tab="productos">Productos</button></nav>
  <button id="logout" class="logout">Salir</button>
 </aside>
 <main class="main"><div id="tab-content"></div></main>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body></html>
