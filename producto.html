<!DOCTYPE html>
<html lang="es-AR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producto - Armain</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css"></head>
<body>
<header class="header"><a href="index.html" class="logo">Armain<span>PERFUMERIA</span></a></header>
<main class="container producto-page" id="detalle">Cargando...</main>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/carrito.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
db.collection('productos').doc(id).get().then(d=>{
 if(!d.exists){detalle.innerHTML='<p>Producto no encontrado</p>';return}
 const p=d.data();document.title=p.nombre+' - Armain';
 detalle.innerHTML=`<div class="prod-detail"><img src="${p.imagen}"><div><h1>${p.nombre}</h1><p class="marca">${p.marca||''}</p><p class="precio">$${p.precio} ARS</p><p>${p.descripcion||''}</p><button onclick="agregarAlCarrito('${d.id}','${p.nombre}',${p.precio},'${p.imagen}')">Añadir al carrito</button><a href="index.html" class="volver">← Volver</a></div></div>`;
});
</script></body></html>
